name: Deploy to SprintHost

# Любой пуш в main пересобирает сайт и раскладывает его на хостинг.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Если два пуша прилетели подряд, побеждает последний — иначе два
  # незаконченных rsync гонятся и могут покорёжить живой сайт.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # Боевой адрес: из него собираются canonical, sitemap и Open Graph.
          SITE_URL: https://scandi-chair.ru
          # Приём заявок: Google Apps Script пишет заявку в таблицу и сам
          # шлёт её в Telegram. Из браузера в Telegram слать нельзя —
          # в РФ api.telegram.org недоступен без VPN.
          PUBLIC_LEAD_ENDPOINT: https://script.google.com/macros/s/AKfycbyAdyDB1IhvXJB8ChTPCcy-PQH9kpkDMxoA0_ajVLN2LlqNlvjWZN6f55RwhQAh26CI/exec
        run: npx astro build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to SprintHost
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          # Слэш в конце локального пути обязателен: копируется содержимое
          # dist, а не сама папка. --delete убирает с хостинга файлы,
          # которых больше нет в сборке.
          rsync -az --delete \
            -e "ssh -p $PORT" \
            dist/ "$USER@$HOST:$TARGET"
